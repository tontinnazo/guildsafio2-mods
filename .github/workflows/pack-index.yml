name: Actualizar archivos del launcher
on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'resourcepacks/**'
      - 'shaderpacks/**'
      - 'pack-defaults.json'
      - 'tools/build-pack-index.js'
      - '.github/workflows/pack-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pack-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Generar y publicar la lista actualizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/build-pack-index.js
            git add pack-manifest.json mods resourcepacks shaderpacks
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Actualizar archivos disponibles para el launcher'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
